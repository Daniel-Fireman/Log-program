<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ABA – Anlægsoversigt</title>

    <link rel="stylesheet" href="styles.css" />
    <script src="aba.js" defer></script>
  </head>

  <body>
    <nav class="navbar" aria-label="Hovednavigation">
      <a class="brand" href="index.html">Junior døgnøvelse</a>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="log.html">Log</a></li>
        <li><a href="odin.html">Odin</a></li>
        <li><a href="aba.html">ABA</a></li>
      </ul>
    </nav>

    <main class="aba-page">
      <h1>ABA</h1>
      <p>Søg efter et anlæg, og se eller ændr dets status.</p>

      <section class="aba-search-section">
        <label for="aba-search">Søg efter anlæg</label>

        <input
          type="search"
          id="aba-search"
          placeholder="Indtast f.eks. ABA17"
          autocomplete="off"
        />

        <p class="aba-hint">Søg efter et anlæg fra ABA1 til ABA100.</p>
      </section>

      <section id="aba-result" class="aba-result" hidden>
        <h2 id="aba-name"></h2>

        <div class="aba-status-row">
          <span>Nuværende status:</span>
          <strong id="aba-status"></strong>
        </div>

        <button type="button" id="aba-toggle-status">Skift status</button>
      </section>

      <p id="aba-message" class="aba-message" aria-live="polite">
        Indtast et anlægsnavn for at søge.
      </p>
    </main>
  </body>
</html>
